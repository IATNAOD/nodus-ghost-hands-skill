name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill:
    name: Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Phrase routing against the built-in NODUS intents
        run: npm run routing:assert
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: skill-zip
          path: dist/*.zip
          if-no-files-found: error

  client:
    name: Client
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run typecheck
      # includes the name-matching corpus shared with the skill
      - run: npm test
      - name: Build GhostHelper.exe
        run: npm run helper
      - name: Helper selftest
        shell: pwsh
        run: |
          $process = Start-Process -FilePath resources/helper/GhostHelper.exe -ArgumentList selftest -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.json
          Get-Content selftest.json
          exit $process.ExitCode
      - run: npm run build
