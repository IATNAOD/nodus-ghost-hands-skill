# One release of the skill and the client: tag vX.Y.Z, made by `npm run release`.
# The skill ZIP and the client installer get one version and lie in one release, marked
# Latest: installed clients update from its latest.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        name: The tag, the skill and the client have one version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in package.json client/package.json skill/skill.json; do
            actual=$(node -p "require('./$file').version")
            if [ "$actual" != "$version" ]; then
              echo "::error file=$file::version $actual, tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  skill:
    name: Skill
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.20"
          cache: yarn
      # the root installs with yarn (yarn.lock), the client with npm (client/package-lock.json)
      - run: yarn install --frozen-lockfile
      - run: npm test
      - run: npm run check
      - run: npm run routing:assert
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: skill
          path: dist/ghost_hands-${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  client:
    name: Client
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build GhostHelper.exe
        run: npm run helper
      - name: Helper selftest
        shell: pwsh
        run: |
          $process = Start-Process -FilePath resources/helper/GhostHelper.exe -ArgumentList selftest -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.json
          Get-Content selftest.json
          exit $process.ExitCode
      - name: Installer
        run: npm run dist
      # what electron-updater reads: latest.yml, the installer and its blockmap
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: |
            client/release/latest.yml
            client/release/*.exe
            client/release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, skill, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l assets
          gh release create "$GITHUB_REF_NAME" assets/* --title "Ghost Hands $VERSION" --generate-notes --latest
