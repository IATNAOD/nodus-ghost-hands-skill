# Client release: tag vX.Y.Z (the same as client/package.json).
# The release is marked Latest and carries latest.yml: installed clients update from it.
name: Release client

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tag matches the client version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match client/package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build GhostHelper.exe
        run: npm run helper
      - name: Helper selftest
        shell: pwsh
        run: |
          $process = Start-Process -FilePath resources/helper/GhostHelper.exe -ArgumentList selftest -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.json
          Get-Content selftest.json
          exit $process.ExitCode
      - name: Build the installer and publish the release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
