<title>Ghost Hands</title>
<style>
  :root {
    --orange: #ff9a4d;
    --purple: #ad67ff;
    --gradient: linear-gradient(135deg, #ad67ff 0%, #ff9a4d 100%);
    --field: #1e1630;
    --border: #2b2140;
    --text: #f8f6fc;
    --text-2: #a89cc4;
    --muted: #7d6f9a;
    --danger: #ff5c7a;
    --on-accent: #140c20;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 16px; display: grid; gap: 14px; max-width: 900px; }
  h1, h2, h3, p { margin: 0; }
  h2 { font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  h2 .step { width: 22px; height: 22px; border-radius: 50%; background: var(--gradient); color: var(--on-accent); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; flex: none; }
  .hero { display: flex; align-items: center; gap: 14px; padding: 4px 2px 2px; }
  .hero svg { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 4px 14px rgba(173, 103, 255, .35)); }
  .hero h1 { font-size: 20px; font-weight: 750; letter-spacing: .2px; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--text-2); }
  .card { background: rgba(30, 22, 48, .72); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: grid; gap: 12px; transition: border-color .2s, box-shadow .2s; }
  .card:hover { border-color: rgba(173, 103, 255, .45); box-shadow: 0 0 24px rgba(173, 103, 255, .12); }
  .hint { color: var(--text-2); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .key { flex: 1 1 280px; min-width: 0; font: 600 15px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .6px; padding: 11px 12px; color: var(--text); background: var(--field); border: 1px solid var(--border); border-radius: 10px; outline: none; }
  .key:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(173, 103, 255, .25); }
  button, .button { appearance: none; border: 1px solid transparent; border-radius: 10px; padding: 9px 14px; font: 600 13px/1.2 inherit; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: filter .15s, background .15s, border-color .15s, transform .05s; }
  button:active, .button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: default; }
  .primary { background: var(--gradient); color: var(--on-accent); }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  .secondary { background: transparent; color: var(--text); border-color: rgba(173, 103, 255, .55); }
  .secondary:hover:not(:disabled) { background: rgba(173, 103, 255, .12); }
  .ghost { background: transparent; color: var(--text-2); padding: 6px 8px; }
  .ghost:hover:not(:disabled) { color: var(--text); }
  .danger { background: transparent; color: var(--danger); border-color: rgba(255, 92, 122, .45); }
  .danger:hover:not(:disabled) { background: rgba(255, 92, 122, .1); }
  .address { font: 600 14px ui-monospace, Consolas, monospace; padding: 4px 10px; border-radius: 8px; background: var(--field); border: 1px solid var(--border); }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--border); color: var(--text-2); }
  .pill.ok { color: var(--orange); border-color: rgba(255, 154, 77, .5); }
  .pill.bad { color: var(--danger); border-color: rgba(255, 92, 122, .5); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .device { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--field); border: 1px solid var(--border); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--orange); box-shadow: 0 0 0 4px rgba(255, 154, 77, .18); }
  .device .body { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .device .name { font-weight: 650; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .device .meta { color: var(--text-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: rgba(173, 103, 255, .16); color: #d6b4ff; }
  .badge.orange { background: rgba(255, 154, 77, .14); color: var(--orange); }
  .empty { color: var(--text-2); padding: 12px; border: 1px dashed var(--border); border-radius: 12px; text-align: center; }
  .history li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; font-size: 13px; padding: 6px 2px; border-bottom: 1px solid rgba(43, 33, 64, .6); }
  .history li:last-child { border-bottom: 0; }
  .history .when { color: var(--muted); white-space: nowrap; }
  .history .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history .fail { color: var(--danger); }
  .history .done { color: var(--orange); }
  .phrases { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
  .phrases div { padding: 8px 10px; border-radius: 10px; background: var(--field); border: 1px solid var(--border); font-size: 13px; }
  .phrases div::before { content: "«"; color: var(--purple); }
  .phrases div::after { content: "»"; color: var(--purple); }
  .warning { border-color: rgba(255, 92, 122, .45); }
  .pc { display: grid; border-radius: 12px; background: var(--field); border: 1px solid var(--border); }
  .pc > .device { border: 0; background: transparent; }
  .parental { display: grid; gap: 14px; padding: 10px 12px 12px; border-top: 1px solid var(--border); }
  .parental .head { display: flex; align-items: center; gap: 10px; }
  .parental .head span { flex: 1; font-weight: 600; font-size: 13px; }
  .parental .body { display: grid; gap: 14px; }
  .switch { width: 40px; height: 22px; flex: none; padding: 0; border: 0; border-radius: 99px; background: #3a2d55; position: relative; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); transition: transform .15s; }
  .switch[aria-checked="true"] { background: var(--gradient); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-accent); }
  .pblock { display: grid; gap: 8px; }
  .pblock h3 { font-size: 13px; font-weight: 650; color: var(--text-2); }
  .pgrid { display: grid; grid-template-columns: auto auto auto; gap: 8px 16px; align-items: center; justify-content: start; font-size: 13px; }
  .pgrid .label { color: var(--text-2); }
  .num { width: 58px; padding: 6px 8px; color: var(--text); background: #140c20; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
  .num:focus, .pin:focus { outline: none; border-color: var(--purple); }
  .pin { width: 150px; padding: 8px 10px; color: var(--text); background: #140c20; border: 1px solid var(--border); border-radius: 8px; font: 600 14px/1 inherit; letter-spacing: .15em; }
  .stat { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; }
  .stat b { font-weight: 650; }
  .games { max-height: 240px; overflow: auto; display: grid; gap: 2px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 10px; background: #140c20; }
  .games label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; }
  .games input { accent-color: var(--purple); }
  .games .tag { color: var(--muted); font-size: 11px; }
  .note { font-size: 12px; color: var(--orange); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .check input { accent-color: var(--purple); width: 16px; height: 16px; margin: 0; }
  .confirm { display: none; padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 92, 122, .45); background: rgba(255, 92, 122, .06); gap: 10px; }
  .confirm.open { display: grid; }
  [hidden] { display: none !important; }
  footer { color: var(--muted); font-size: 12px; padding: 0 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

        </linearGradient>

    <div>

  </section>

  <section class="card warning" id="off" hidden>

  </section>

  <section class="card">
    <h2><span class="step">1</span><span data-t="installTitle"></span></h2>
    <p class="hint" data-t="installHint"></p>
    <div class="row">
      <a class="button primary" id="download" href="https://github.com/IATNAOD/nodus-ghost-hands-skill/releases/latest" target="_blank" rel="noopener" data-t="download"></a>
    </div>
  </section>

  <section class="card">
    <h2><span class="step">2</span><span data-t="keyTitle"></span></h2>
    <p class="hint" data-t="keyHint"></p>
    <div class="row">
      <input class="key" id="key" readonly spellcheck="false" aria-label="key" />
      <button class="secondary" id="reveal" data-t="show"></button>
      <button class="primary" id="copy" data-t="copy"></button>
    </div>
    <div class="row">
      <button class="secondary" id="open" data-t="openApp"></button>
      <button class="ghost" id="rotate" data-t="rotate"></button>
      <span class="hint" id="keyMeta"></span>
    </div>
    <div class="confirm" id="rotateConfirm">
      <p data-t="rotateWarn"></p>
      <div class="row">
        <button class="danger" id="rotateYes" data-t="rotateYes"></button>
        <button class="ghost" id="rotateNo" data-t="cancel"></button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2><span class="step">3</span><span data-t="addressTitle"></span></h2>
    <p class="hint" data-t="addressHint"></p>
    <div class="row">
      <span class="address" id="address"></span>
      <span class="pill" id="serverState"></span>
    </div>
    <p class="hint" id="ips"></p>
  </section>

  <section class="card">
    <h2 data-t="myPcs"></h2>
    <ul id="devices"></ul>
  </section>

  <section class="card" id="sharedCard" hidden>
    <h2 data-t="sharedPcs"></h2>
    <ul id="shared"></ul>
  </section>

  <section class="card">
    <h2 data-t="historyTitle"></h2>
    <ul class="history" id="history"></ul>
  </section>

  <section class="card">
    <h2 data-t="phrasesTitle"></h2>
    <div class="phrases" id="phrases"></div>
  </section>

  <section class="card" id="adminCard" hidden>
    <h2 data-t="adminTitle"></h2>
    <ul id="adminDevices"></ul>
  </section>

  <footer id="footer"></footer>
</main>

      pinSet: "PIN is set",

      voiceTitle: "Alerts",
      voiceLabel: "NODUS tells by voice",
      voiceHint: "When Ghost Hands was killed, the computer went missing, the limits were lifted with the PIN or a wrong PIN was entered. Without the voice the scenario events stay: a scenario can forward them, to Telegram for example.",
      gamesTitle: "What counts as a game",
      gamesHint: "Steam, Epic and GOG games are marked already. Mark what else counts as a game.",
      gamesEmpty: "The list appears when the computer sends its apps.",
      gamesFilter: "Find",
      game: "game",

      saved: "Saved",
      durHM: "{{h}} h {{m}} min",
      durH: "{{h}} h",
      durM: "{{m}} min",
      "error.pin-format": "The PIN is 6 to 12 digits.",
      "error.pin-weak": "The PIN is too simple: no repeats and no runs of digits.",
      "error.minutes-invalid": "Wrong time.",
      "error.not-found": "The computer isn't found.",
      actions: {
        "app.launch": "Launch", "app.close": "Close", "volume.set": "Volume", "volume.change": "Volume",
        "volume.mute": "Sound", "volume.get": "Volume", "media.key": "Media", "media.control": "Media", "window.close": "Window closed",
        "power.shutdown": "Shutdown", "power.restart": "Restart", "power.sleep": "Sleep", "power.lock": "Lock",
        "power.cancel": "Cancel shutdown", "display.off": "Monitor", "web.search": "Search", "toast.show": "Message",
        "wake": "Wake-on-LAN", "parental.on": "Parental control on", "parental.off": "Parental control off",
        "parental.pin": "PIN changed", "parental.grant": "Limits lifted", "parental.revoke": "Limits back",
        "parental.reset": "Today's time reset",
      },
      phrases: [
        "launch steam", "open chrome on the laptop", "close the game", "close the active window", "close discord",
        "turn up the volume on the computer", "mute the pc", "pause on the computer", "resume on the computer", "next track on the pc",
        "search the web for cheap flights", "shut down the computer", "cancel shutdown", "lock the computer",
        "turn on the computer", "which computers are online", "lift the limits on the kids computer for an hour",
      ],
    },
  };

  const SKILL = location.pathname.split("/")[4] || "ghost_hands";
  const API = `/api/v1/skills/${SKILL}/routes`;
  const $ = (id) => document.getElementById(id);
  let lang = "ru";
  let texts = TEXTS.ru;
  let me = null;
  let revealed = "";
  let pendingUnpair = null;
  let pollTimer = null;

  const fill = (template, vars = {}) => String(template).replace(/\{\{(\w+)\}\}/g, (_, name) => String(vars[name] ?? ""));
  const tr = (key, vars) => fill(texts[key] ?? TEXTS.en[key] ?? key, vars);
  const post = (type, data) => parent.postMessage({ type, data }, window.origin);
  const notify = (level, message) => post("notify", { level, message });
  const el = (tag, className, text) => {
    const node = document.createElement(tag);

    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const ago = (value) => {
    if (!value) return "";

    const seconds = Math.round((new Date(value).getTime() - Date.now()) / 1000);
    const format = new Intl.RelativeTimeFormat(lang, { numeric: "auto" });
    const units = [["day", 86400], ["hour", 3600], ["minute", 60]];

    for (const [unit, size] of units) if (Math.abs(seconds) >= size) return format.format(Math.round(seconds / size), unit);
    return format.format(seconds, "second");
  };

  async function call(path, method = "GET", body) {
    const res = await fetch(`${API}${path}`, body === undefined
      ? { method, credentials: "same-origin" }
      : { method, credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));

    if (res.status === 404 && data.message === "skill-not-found") {
      $("off").hidden = false;
      throw new Error("skill-not-found");
    }
    if (!res.ok || data.success === false) throw new Error(data.message || `http-${res.status}`);
    return data.result ?? data;
  }

  function applyTexts() {
    document.documentElement.lang = lang;
    for (const node of document.querySelectorAll("[data-t]")) node.textContent = tr(node.dataset.t);
    $("reveal").textContent = revealed ? tr("hide") : tr("show");
    $("phrases").replaceChildren(...texts.phrases.map((phrase) => el("div", "", phrase)));
    if (me) render();
  }

  function renderKey() {
    const key = me.key || {};

    $("key").value = revealed || (key.readable === false ? "" : key.masked || "");
    $("key").placeholder = key.readable === false ? tr("keyUnreadable") : "";

    const parts = [];

    if (key.createdAt) parts.push(tr("keyCreated", { when: ago(key.createdAt) }));
    if (key.lastUsedAt) parts.push(tr("keyUsed", { when: ago(key.lastUsedAt) }));
    $("keyMeta").textContent = parts.join(" · ");
  }

  function fillDevice(item, device, { mine, owner } = {}) {
    const dot = el("span", `dot${device.online ? " on" : ""}`);
    const body = el("div", "body");
    const name = el("div", "name", device.name);
    const meta = [];

    if (device.shared && mine) name.append(el("span", "badge", tr("shared")));
    if (device.wol) name.append(el("span", "badge orange", device.wolWifi ? `${tr("wol")} · ${tr("wolWifi")}` : tr("wol")));
    if (device.paused) name.append(el("span", "badge", tr("paused")));

    meta.push(device.online ? tr("online") : device.lastSeenAt ? tr("offline", { when: ago(device.lastSeenAt) }) : tr("neverSeen"));
    if (owner) meta.push(tr("owner", { name: owner }));
    if (typeof device.apps === "number") meta.push(tr("apps", { count: device.apps }));
    if (device.client) meta.push(`v${device.client}`);

    body.append(name, el("div", "meta", meta.join(" · ")));
    item.replaceChildren(dot, body);

    if (mine) {
      const button = el("button", "danger", pendingUnpair === device.id ? tr("unpairConfirm") : tr("unpair"));

      button.addEventListener("click", () => unpair(device.id));
      item.append(button);
    }
    return item;
  }

  const deviceItem = (device, options) => fillDevice(el("li", "device"), device, options);

  /* ── parental control in "My computers": only the owner's own PCs ── */

  // the nodes of my PCs stay between polls: a field being typed in keeps its text and focus
  const pcNodes = new Map();
  const parentalViews = new Map();

  const pad = (value) => String(value).padStart(2, "0");
  const todayKey = () => {
    const now = new Date();

    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  };
  const dur = (seconds) => {
    const minutes = Math.max(0, Math.round(seconds / 60));
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;

    return h ? tr(m ? "durHM" : "durH", { h, m }) : tr("durM", { m });
  };
  const clockOf = (value) => new Date(value).toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" });
  const errorText = (error) => texts[`error.${error.message}`] ?? tr("errorPrefix") + error.message;
  const button = (className, text, onClick) => {
    const node = el("button", className, text);

    node.type = "button";
    node.addEventListener("click", onClick);
    return node;
  };
  const num = (min, max, step = 1) => {
    const input = el("input", "num");

    Object.assign(input, { type: "number", min, max, step });
    return input;
  };
  const block = (title, ...children) => {
    const node = el("div", "pblock");

    node.append(el("h3", "", title), ...children);
    return node;
  };
  const line = (...children) => {
    const node = el("div", "row");

    node.append(...children);
    return node;
  };

  async function loadParental() {
    try {
      const result = await call("/parental");

      parentalViews.clear();
      for (const view of result.devices || []) parentalViews.set(view.id, view);
    } catch (error) {
      if (error.message === "skill-not-found") throw error;
    }
  }

  async function parentalCall(panel, path, method, body, { clean = false } = {}) {
    try {
      const view = await call(`/parental/${encodeURIComponent(panel.id)}${path}`, method, body);

      parentalViews.set(panel.id, view);
      if (clean) panel.dirty = false;
      updatePanel(panel, view);
      return true;
    } catch (error) {
      notify("error", errorText(error));
      return false;
    }
  }

  function createPanel(id) {
    const panel = { id, dirty: false, appsKey: "", fields: {} };
    const root = el("div", "parental");
    const head = el("div", "head");
    const toggle = button("switch", undefined, () => parentalCall(panel, "", "PUT", { enabled: toggle.getAttribute("aria-checked") !== "true" }));

    toggle.setAttribute("role", "switch");
    toggle.setAttribute("aria-label", tr("parental"));
    head.append(el("span", "", tr("parental")), toggle);

    // today: what is used, what is lifted, the buttons
    const stat = el("div", "stat");
    const badges = el("div", "row");
    const revoke = button("ghost", tr("revoke"), () => parentalCall(panel, "/revoke", "POST", {}));
    const actions = line(el("span", "hint", tr("lift")));

    for (const hours of [1, 2, 4]) actions.append(button("secondary", tr("liftFor", { time: dur(hours * 3600) }), () => parentalCall(panel, "/grant", "POST", { minutes: hours * 60 })));
    actions.append(
      button("secondary", tr("liftDay"), () => parentalCall(panel, "/grant", "POST", { minutes: "day" })),
      revoke,
      button("ghost", tr("resetToday"), () => parentalCall(panel, "/reset-today", "POST", {})),
    );

    // PIN: set here, checked on the PC; never shown back
    const pinState = el("span", "hint");
    const pin = el("input", "pin");
    const pinSave = button("secondary", tr("pinSave"), async () => {
      pinSave.disabled = true;
      if (await parentalCall(panel, "/pin", "PUT", { pin: pin.value })) {
        pin.value = "";
        notify("success", tr("saved"));
      } else {
        pinSave.disabled = false;
      }
    });

    Object.assign(pin, { type: "password", inputMode: "numeric", autocomplete: "new-password", maxLength: 12 });
    pin.addEventListener("input", () => {
      pin.value = pin.value.replace(/\D/g, "");
      pinSave.disabled = pin.value.length < 6;
    });
    pinSave.disabled = true;

    // limits for weekdays and the weekend: hours and minutes, empty - no limit
    const limits = el("div", "pgrid");

    limits.append(el("span"), el("span", "label", tr("pcTime")), el("span", "label", tr("gamesTime")));
    for (const day of ["weekday", "weekend"]) {
      limits.append(el("span", "label", tr(day)));
      for (const kind of ["pc", "games"]) {
        const hours = num(0, 24);
        const minutes = num(0, 59, 5);

        panel.fields[`${day}.${kind}`] = [hours, minutes];
        limits.append(line(hours, el("span", "hint", tr("hoursShort")), minutes, el("span", "hint", tr("minutesShort"))));
      }
    }

    const extend = el("div", "pgrid");

    extend.append(el("span"), el("span", "label", tr("pcTime")), el("span", "label", tr("gamesTime")));
    for (const [field, label] of [["minutes", "extendMinutes"], ["times", "extendTimes"]]) {
      extend.append(el("span", "label", tr(label)));
      for (const kind of ["pc", "games"]) {
        const input = field === "minutes" ? num(5, 120, 5) : num(0, 10);

        panel.fields[`extend.${kind}.${field}`] = input;
        extend.append(input);
      }
    }

    const unlock = num(15, 720, 15);
    const unlockRow = line(el("span", "label", tr("unlockTitle")), unlock, el("span", "hint", tr("minutesShort")));

    // alerts to the owner by voice; off - only the scenario events
    const voice = el("input");
    const voiceRow = el("label", "check");

    voice.type = "checkbox";
    voiceRow.append(voice, el("span", "", tr("voiceLabel")));

    // what counts as a game: the PC's apps, Steam/Epic/GOG games marked already
    const games = el("div", "games");
    const filter = el("input", "num");

    filter.style.width = "200px";
    filter.placeholder = tr("gamesFilter");
    filter.addEventListener("input", () => {
      const needle = filter.value.trim().toLowerCase();

      for (const item of games.children) item.hidden = Boolean(needle) && !(item.dataset.name ?? "").includes(needle);
    });

    const save = button("primary", tr("save"), async () => {
      save.disabled = true;
      if (await parentalCall(panel, "", "PUT", { rules: readRules(panel) }, { clean: true })) notify("success", tr("saved"));
      else save.disabled = false;
    });
    const markDirty = () => {
      panel.dirty = true;
      save.disabled = false;
    };

    for (const node of [limits, extend, unlockRow, voiceRow, games]) {
      node.addEventListener("input", markDirty);
      node.addEventListener("change", markDirty);
    }
    save.disabled = true;

    const note = el("p", "note");
    const body = el("div", "body");

    body.append(
      el("p", "hint", tr("parentalHint")),
      note,
      block(tr("today"), stat, badges, actions),
      block(tr("pinTitle"), line(pin, pinSave, pinState), el("p", "hint", tr("pinHint"))),
      block(tr("limitsTitle"), limits, el("p", "hint", tr("limitsHint"))),
      block(tr("extendTitle"), extend, el("p", "hint", tr("extendHint"))),
      unlockRow,
      block(tr("voiceTitle"), voiceRow, el("p", "hint", tr("voiceHint"))),
      block(tr("gamesTitle"), el("p", "hint", tr("gamesHint")), filter, games),
      line(save),
    );
    root.append(head, body);
    Object.assign(panel, { root, toggle, body, note, stat, badges, revoke, pinState, unlock, voice, games, save });
    return panel;
  }

  function updatePanel(panel, view) {
    panel.root.hidden = !view;
    if (!view) return;

    panel.toggle.setAttribute("aria-checked", String(view.enabled));
    // the settings are shown only while the control is on
    panel.body.hidden = !view.enabled;
    if (!view.enabled) return;

    panel.note.textContent = view.outdated ? tr("parentalOutdated") : view.online ? "" : tr("parentalOffline");
    panel.note.hidden = !panel.note.textContent;

    const { rules } = view;
    const usage = view.usage && view.usage.day === todayKey() ? view.usage : { pcSec: 0, gameSec: 0, extended: { pc: 0, games: 0 }, locked: null };
    const today = rules.limits[[0, 6].includes(new Date().getDay()) ? "weekend" : "weekday"];
    const used = (title, seconds, baseMin, extended, extend) => {
      const node = el("span");
      const limit = baseMin === null ? null : baseMin + extended * extend.minutes;

      node.append(el("b", "", `${title}: `), limit === null ? tr("usedNoLimit", { used: dur(seconds) }) : tr("usedOf", { used: dur(seconds), limit: dur(limit * 60) }));
      return node;
    };

    panel.stat.replaceChildren(
      used(tr("pcTime"), usage.pcSec, today.pcMin, usage.extended.pc, rules.extend.pc),
      used(tr("gamesTime"), usage.gameSec, today.gamesMin, usage.extended.games, rules.extend.games),
      el("span", "hint", tr("extendsUsed", { pc: `${usage.extended.pc}/${rules.extend.pc.times}`, games: `${usage.extended.games}/${rules.extend.games.times}` })),
    );

    const badges = view.grantUntil
      ? [el("span", "badge orange", tr("grantedUntil", { time: clockOf(view.grantUntil) }))]
      : usage.locked ? [el("span", "badge", tr(usage.locked === "pc" ? "lockedPc" : "lockedGames"))] : [];

    panel.badges.replaceChildren(...badges);
    panel.badges.hidden = !badges.length;
    panel.revoke.hidden = !view.grantUntil;
    panel.pinState.textContent = view.pinSet ? tr("pinSet") : tr("pinNotSet");

    if (!panel.dirty) fillRules(panel, view);
  }

  function fillRules(panel, view) {
    const { rules } = view;

    for (const day of ["weekday", "weekend"]) {
      for (const kind of ["pc", "games"]) {
        const [hours, minutes] = panel.fields[`${day}.${kind}`];
        const value = rules.limits[day][kind === "pc" ? "pcMin" : "gamesMin"];

        hours.value = value === null ? "" : String(Math.floor(value / 60));
        minutes.value = value === null ? "" : String(value % 60);
      }
    }
    for (const kind of ["pc", "games"]) {
      panel.fields[`extend.${kind}.minutes`].value = String(rules.extend[kind].minutes);
      panel.fields[`extend.${kind}.times`].value = String(rules.extend[kind].times);
    }
    panel.unlock.value = String(rules.unlockMinutes);
    panel.voice.checked = rules.voice !== false;

    const key = JSON.stringify([view.apps, rules.games]);

    if (key !== panel.appsKey) {
      const add = new Set(rules.games.add);
      const remove = new Set(rules.games.remove);
      const apps = [...view.apps].sort((a, b) => Number(b.game) - Number(a.game) || a.name.localeCompare(b.name));

      panel.appsKey = key;
      panel.games.replaceChildren(...(apps.length ? apps.map((app) => {
        const label = el("label");
        const box = el("input");

        Object.assign(box, { type: "checkbox", value: app.id, checked: (app.game && !remove.has(app.id)) || add.has(app.id) });
        box.dataset.game = app.game ? "1" : "";
        label.dataset.name = app.name.toLowerCase();
        label.append(box, el("span", "", app.name));
        if (app.game) label.append(el("span", "tag", tr("game")));
        return label;
      }) : [el("p", "hint", tr("gamesEmpty"))]));
    }
    panel.save.disabled = true;
  }

  function readRules(panel) {
    const minutesOf = ([hours, minutes]) => (hours.value === "" && minutes.value === "" ? null : Math.min(1440, (Number(hours.value) || 0) * 60 + (Number(minutes.value) || 0)));
    const day = (name) => ({ pcMin: minutesOf(panel.fields[`${name}.pc`]), gamesMin: minutesOf(panel.fields[`${name}.games`]) });
    const extend = (kind) => ({ minutes: Number(panel.fields[`extend.${kind}.minutes`].value) || 15, times: Number(panel.fields[`extend.${kind}.times`].value) || 0 });
    const add = [];
    const remove = [];

    for (const box of panel.games.querySelectorAll("input[type=checkbox]")) {
      if (box.checked && !box.dataset.game) add.push(box.value);
      if (!box.checked && box.dataset.game) remove.push(box.value);
    }
    return { limits: { weekday: day("weekday"), weekend: day("weekend") }, extend: { pc: extend("pc"), games: extend("games") }, unlockMinutes: Number(panel.unlock.value) || 120, voice: panel.voice.checked, games: { add, remove } };
  }

  function renderMine() {
    const list = $("devices");

    if (!me.devices.length) {
      pcNodes.clear();
      list.replaceChildren(el("li", "empty", tr("noPcs")));
      return;
    }

    const items = me.devices.map((device) => {
      let node = pcNodes.get(device.id);

      if (!node) {
        node = { item: el("li", "pc"), row: el("div", "device"), panel: createPanel(device.id) };
        node.item.append(node.row, node.panel.root);
        pcNodes.set(device.id, node);
      }
      fillDevice(node.row, device, { mine: true });
      updatePanel(node.panel, parentalViews.get(device.id));
      return node.item;
    });

    for (const id of [...pcNodes.keys()]) if (!me.devices.some((device) => device.id === id)) pcNodes.delete(id);
    // the same PCs in the same order: the nodes are left in place
    if (items.length !== list.children.length || items.some((item, i) => list.children[i] !== item)) list.replaceChildren(...items);
  }

  function render() {
    renderKey();

    const server = me.server || {};
    const state = { listening: ["listening", "ok"], "port-busy": ["portBusy", "bad"], error: ["serverError", "bad"], starting: ["starting", ""] }[server.state] || ["serverError", "bad"];

    $("address").textContent = `${server.host || "project-nod.local"}:${server.port || 47300}`;
    $("serverState").textContent = tr(state[0]);
    $("serverState").className = `pill ${state[1]}`;
    $("ips").textContent = server.addresses?.length ? tr("ipList", { ips: server.addresses.join(", ") }) : "";
    $("download").href = me.downloadUrl || $("download").href;

    renderMine();

    $("sharedCard").hidden = !me.shared.length;
    $("shared").replaceChildren(...me.shared.map((device) => deviceItem(device, { owner: device.owner })));

    $("footer").textContent = tr("footer", { version: me.version || "" });
  }

  function renderHistory(items) {
    if (!items.length) return $("history").replaceChildren(el("li", "empty", tr("noHistory")));

    $("history").replaceChildren(...items.map((entry) => {
      const item = el("li");
      const action = texts.actions[entry.action] || entry.action;
      // "parental.grant" keeps minutes or "day"
      const target = entry.action === "parental.grant" && entry.target
        ? entry.target === "day" ? tr("liftDay") : Number(entry.target) ? tr("liftFor", { time: dur(Number(entry.target) * 60) }) : entry.target
        : entry.target;
      const what = [action, target, entry.pc ? `· ${entry.pc}` : ""].filter(Boolean).join(" ");

      item.append(el("span", "when", ago(entry.at)), el("span", "what", what), el("span", entry.ok ? "done" : "fail", entry.ok ? "✓" : entry.code || "×"));
      return item;
    }));
  }

  async function load() {
    try {
      me = await call("/me");
      if (!me.key?.exists) {
        await call("/key/ensure", "POST", {});
        me = await call("/me");
      }
      await loadParental();
      render();

      const history = await call("/history");

      renderHistory(history.items || []);

      if (me.isAdmin) {
        const overview = await call("/admin/overview");

        $("adminCard").hidden = false;
        $("adminDevices").replaceChildren(...overview.devices.map((device) => deviceItem(device, { owner: device.owner })));
      }
    } catch (error) {
      if (error.message !== "skill-not-found") notify("error", tr("errorPrefix") + error.message);
    }
  }

  async function reveal() {
    if (revealed) {
      revealed = "";
      applyTexts();
      return revealed;
    }
    const result = await call("/key/reveal", "POST", {});

    revealed = result.key;
    applyTexts();
    return revealed;
  }

  function copyText(text) {
    const input = $("key");
    const shown = input.value;

    input.value = text;
    input.focus();
    input.select();
    input.setSelectionRange(0, text.length);

    let copied = false;

    try {
      copied = document.execCommand("copy");
    } catch {
      copied = false;
    }
    if (!revealed) input.value = shown;
    notify(copied ? "success" : "error", copied ? tr("copied") : tr("copyFailed"));
  }

  async function unpair(id) {
    if (pendingUnpair !== id) {
      pendingUnpair = id;
      render();
      setTimeout(() => {
        if (pendingUnpair === id) {
          pendingUnpair = null;
          if (me) render();
        }
      }, 4000);
      return;
    }
    pendingUnpair = null;
    try {
      await call(`/devices/${encodeURIComponent(id)}`, "DELETE");
      notify("success", tr("unpaired"));
      await load();
    } catch (error) {
      notify("error", tr("errorPrefix") + error.message);
    }
  }

  $("reveal").addEventListener("click", () => reveal().catch((error) => notify("error", tr("errorPrefix") + error.message)));
  $("copy").addEventListener("click", async () => {
    try {
      copyText(revealed || (await call("/key/reveal", "POST", {})).key);
    } catch (error) {
      notify("error", tr("errorPrefix") + error.message);
    }
  });
  $("open").addEventListener("click", async () => {
    try {
      const key = revealed || (await call("/key/reveal", "POST", {})).key;
      const server = me?.server || {};
      const link = `ghosthands://pair?key=${encodeURIComponent(key)}&host=${encodeURIComponent(server.host || "project-nod.local")}&port=${encodeURIComponent(server.port || 47300)}`;

      window.open(link, "_top");
    } catch (error) {
      notify("error", tr("errorPrefix") + error.message);
    }
  });
  $("rotate").addEventListener("click", () => $("rotateConfirm").classList.add("open"));
  $("rotateNo").addEventListener("click", () => $("rotateConfirm").classList.remove("open"));
  $("rotateYes").addEventListener("click", async () => {
    $("rotateYes").disabled = true;
    try {
      const result = await call("/key/rotate", "POST", {});

      $("rotateConfirm").classList.remove("open");
      revealed = result.key;
      notify("success", tr("rotated"));
      await load();
      applyTexts();
    } catch (error) {
      notify("error", tr("errorPrefix") + error.message);
    } finally {
      $("rotateYes").disabled = false;
    }
  });

  // init arrives on the frame's load: subscribe right away
  window.addEventListener("message", (event) => {
    if (event.origin !== window.origin || event.source !== parent) return;

    const { type, data } = event.data || {};

    if (type === "init") {
      lang = data?.language === "en" ? "en" : "ru";
      texts = TEXTS[lang];
      // the panels are built with the texts of their language
      pcNodes.clear();
      applyTexts();
    }
  });

  new ResizeObserver(() => post("resize", { height: document.body.scrollHeight })).observe(document.body);

  applyTexts();
  load();
  pollTimer = setInterval(() => {
    if (document.visibilityState === "visible") load();
  }, 10000);
  window.addEventListener("pagehide", () => clearInterval(pollTimer));
</script>
</body>
</html>
